<label>Name: </label><input [(ngModel)]="name" type="text">
<br><br>
<label>Country: </label><input [(ngModel)]="country" type="text">
<br><br>
<button (click)="addUser()">Add</button>

<br><br>
<table border="1" width="40%">
  <thead>
    <tr>
      <th>Name</th>
      <th>Country</th>
      <th>Actions</th>
    </tr>
  </thead>
  @for (user of users; track $index) {
    @if (isEditing) {
    <tr>
      <td><input [(ngModel)]="tempName" type="text"/></td>
      <td><input [(ngModel)]="tempCount" type="text"/></td>
      <td>
        <button (click)="saveUser($index)">Save</button>
      </td>
    </tr>
   }
    @else{
    <tr>
      <td>{{user.name}}</td>
      <td>{{user.country}}</td>
      <td>
        <button (click)="editUser($index)">Edit</button>
        <button (click)="deleteUser($index)">Delete</button>
      </td>
    </tr>
   }
  }

</table>

<br><br>
<button (click)="alert()">Alert</button>
