<div class="product-container">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search Products</mat-label>
    <input matInput [(ngModel)]="searchTerm" placeholder="e.g. headphones" />
    <button mat-icon-button matSuffix type="button" aria-label="Clear search" (click)="clearSearch()">
      <mat-icon>clear</mat-icon>
    </button>
  </mat-form-field>
  <div class="product-grid">
    @for (product of filteredProducts(); track product.id){
    <app-product-card [product]="product" (addToCart)="onAddToCart($event)"/>
    }
    @empty {
    <div class="empty-state">
      <mat-icon>inventory_2</mat-icon>
      <p>No products match your search</p>
    </div>
    }
  </div>
</div>
